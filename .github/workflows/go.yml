name: go

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # Unit tests and end-to-end tests (the real binary against real git repos in temp dirs).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The Windows binary has not been run on Windows yet (some e2e tests skip there). Until a green run says otherwise,
    # a failure on Windows is reported but does not block a release.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release VERSION=${{ github.ref_name }}
      - run: gh release create "${{ github.ref_name }}" release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
